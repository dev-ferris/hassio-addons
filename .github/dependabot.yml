---
# Keeps the pinned GitHub Actions SHAs from silently going stale.
# Dependabot rewrites the SHA and updates the trailing version comment.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    labels:
      - dependencies
    groups:
      github-actions:
        patterns:
          - "*"
