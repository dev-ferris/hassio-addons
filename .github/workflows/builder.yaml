---
name: Builder

# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - main
      - master
    paths:
      - "*/config.yaml"
      - "*/build.yaml"
      - "*/Dockerfile"
      - "*/rootfs/**"
      - "*/apparmor.txt"
      - ".github/workflows/builder.yaml"
  pull_request:
    paths:
      - "*/config.yaml"
      - "*/build.yaml"
      - "*/Dockerfile"
      - "*/rootfs/**"
      - "*/apparmor.txt"
      - ".github/workflows/builder.yaml"
  workflow_dispatch:

# Least privilege by default; every job opts into exactly what it needs.
permissions: {}

# Superseded pull request runs are pointless, cancel them. Pushes to the
# default branch are never cancelled so that no release build is lost.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  init:
    name: Initialize builds
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      addons: ${{ steps.matrix.outputs.addons }}
      found: ${{ steps.matrix.outputs.found }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Needed to diff against the base commit below
          fetch-depth: 0
          persist-credentials: false

      - name: Determine add-ons to build
        id: matrix
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          # Build everything unless we can reliably tell what changed.
          build_all=true
          changed=""
          if [[ "${EVENT_NAME}" == "push" || "${EVENT_NAME}" == "pull_request" ]] \
            && [[ -n "${BASE_SHA}" ]] \
            && [[ "${BASE_SHA}" != "0000000000000000000000000000000000000000" ]] \
            && git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            changed=$(git diff --name-only "${BASE_SHA}" "${HEAD_SHA}")
            # A workflow change can affect every add-on
            if grep -q '^\.github/workflows/' <<< "${changed}"; then
              echo "Workflow changed, building all add-ons."
            else
              build_all=false
            fi
          else
            echo "No usable base commit, building all add-ons."
          fi

          matrix='{"include":[]}'
          addons='[]'
          for config in */config.yaml; do
            [[ -e "${config}" ]] || continue
            addon="${config%/config.yaml}"

            if [[ "${build_all}" == "false" ]] \
              && ! grep -q "^${addon}/" <<< "${changed}"; then
              echo "::notice::No changes in ${addon}, skipping."
              continue
            fi

            # Round-trip through JSON so quoting styles in YAML cannot leak
            # into the values (e.g. version: "0.2.46").
            version=$(yq --no-colors eval -o=json -I=0 '.version' "${config}" | jq -r '.')
            image=$(yq --no-colors eval -o=json -I=0 '.image // ""' "${config}" | jq -r '.')
            if [[ -z "${image}" || "${image}" == "null" ]]; then
              echo "::error::${addon} has no 'image' set, cannot publish it."
              exit 1
            fi

            addons=$(jq -c --arg addon "${addon}" '. += [$addon]' <<< "${addons}")

            while read -r arch; do
              [[ -n "${arch}" ]] || continue

              # The new builder actions build natively instead of under QEMU
              case "${arch}" in
                amd64) os="ubuntu-24.04" ;;
                aarch64) os="ubuntu-24.04-arm" ;;
                *)
                  echo "::error::${addon} requests unsupported architecture ${arch}."
                  exit 1
                  ;;
              esac

              build_from=$(yq --no-colors eval -o=json -I=0 \
                ".build_from.\"${arch}\" // \"\"" "${addon}/build.yaml" | jq -r '.')
              if [[ -z "${build_from}" || "${build_from}" == "null" ]]; then
                echo "::error::${addon}/build.yaml has no build_from for ${arch}."
                exit 1
              fi

              matrix=$(jq -c \
                --arg addon "${addon}" \
                --arg arch "${arch}" \
                --arg os "${os}" \
                --arg version "${version}" \
                --arg build_from "${build_from}" \
                --arg image "${image//\{arch\}/${arch}}" \
                '.include += [{
                   addon: $addon, arch: $arch, os: $os,
                   version: $version, build_from: $build_from, image: $image
                 }]' <<< "${matrix}")
            done < <(yq --no-colors eval -o=json -I=0 '.arch' "${config}" | jq -r '.[]')
          done

          if [[ "$(jq -r '.include | length' <<< "${matrix}")" -eq 0 ]]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"
          echo "addons=${addons}" >> "$GITHUB_OUTPUT"
          jq . <<< "${matrix}"

  lint:
    name: Lint ${{ matrix.addon }} add-on
    needs: init
    if: needs.init.outputs.found == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        addon: ${{ fromJSON(needs.init.outputs.addons) }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint add-on configuration
        uses: frenck/action-addon-linter@b9cfd1bc62ba60d2c4fc96317b5f7ada5923f4a7 # v2.21.1
        with:
          path: "./${{ matrix.addon }}"

  build:
    name: Build ${{ matrix.arch }} ${{ matrix.addon }} add-on
    needs: init
    if: needs.init.outputs.found == 'true'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read # Check out the code
      packages: write # Push images to the GitHub Container Registry
      id-token: write # Keyless Cosign signing via the OIDC token
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.init.outputs.matrix) }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Collect build arguments and labels
        id: args
        env:
          ADDON: ${{ matrix.addon }}
          BUILD_FROM: ${{ matrix.build_from }}
        run: |
          set -euo pipefail

          function config_value() {
            yq --no-colors eval -o=json -I=0 "${1}" "${ADDON}/config.yaml" | jq -r '.'
          }

          function build_entries() {
            yq --no-colors eval -o=json -I=0 "${1} // {}" "${ADDON}/build.yaml" \
              | jq -r 'to_entries[] | "\(.key)=\(.value)"'
          }

          {
            echo "build_args<<EOF"
            echo "BUILD_FROM=${BUILD_FROM}"
            echo "BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
            echo "BUILD_DESCRIPTION=$(config_value '.description')"
            echo "BUILD_NAME=$(config_value '.name')"
            echo "BUILD_REF=${GITHUB_SHA}"
            echo "BUILD_REPOSITORY=${GITHUB_REPOSITORY}"
            build_entries '.args'
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          {
            echo "labels<<EOF"
            build_entries '.labels'
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # Replaces the deprecated home-assistant/builder action, which upstream
      # has announced will be removed. Builds natively per architecture instead
      # of under QEMU, adds BuildKit layer caching and Cosign signing.
      - name: Build ${{ matrix.addon }} add-on
        uses: home-assistant/builder/actions/build-image@4de35182ce1e329181bffcbcc84d33db5e2c7e10 # 2026.06.0
        with:
          arch: ${{ matrix.arch }}
          context: "./${{ matrix.addon }}"
          image: ${{ matrix.image }}
          image-tags: |
            ${{ matrix.version }}
            latest
          version: ${{ matrix.version }}
          build-args: ${{ steps.args.outputs.build_args }}
          labels: ${{ steps.args.outputs.labels }}
          cache-gha-scope: ${{ matrix.addon }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          # Pull requests build for validation only, they never publish.
          push: ${{ github.event_name != 'pull_request' }}
          cosign: ${{ github.event_name != 'pull_request' }}
