name: Builder

env:
  BUILD_ARGS: "--test"

on:
  push:
    branches:
      - main
      - master
    paths:
      - "hawser/**"
      - ".github/workflows/builder.yaml"
  pull_request:
    paths:
      - "hawser/**"
      - ".github/workflows/builder.yaml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  init:
    runs-on: ubuntu-latest
    name: Initialize builds
    outputs:
      changed_addons: ${{ steps.changed_addons.outputs.addons }}
      changed: ${{ steps.changed_addons.outputs.changed }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Find add-on directories
        id: changed_addons
        run: |
          addons=()
          for cfg in $(find . -mindepth 2 -maxdepth 2 -name "config.yaml"); do
            addons+=("\"$(dirname "$cfg" | sed 's|^\./||')\"")
          done
          if [[ ${#addons[@]} -gt 0 ]]; then
            joined=$(IFS=,; echo "${addons[*]}")
            echo "addons=[${joined}]" >> "$GITHUB_OUTPUT"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: init
    runs-on: ubuntu-latest
    if: needs.init.outputs.changed == 'true'
    name: Build ${{ matrix.arch }} ${{ matrix.addon }} add-on
    strategy:
      fail-fast: false
      matrix:
        addon: ${{ fromJSON(needs.init.outputs.changed_addons) }}
        arch: ["amd64", "aarch64"]
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Get information
        id: info
        uses: home-assistant/actions/helpers/info@master
        with:
          path: "./${{ matrix.addon }}"

      - name: Check if architecture is supported
        id: arch_check
        run: |
          if [[ "${{ steps.info.outputs.architectures }}" =~ ${{ matrix.arch }} ]]; then
            echo "supported=true" >> "$GITHUB_OUTPUT"
          else
            echo "supported=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Architecture ${{ matrix.arch }} not supported by ${{ matrix.addon }}, skipping."
          fi

      - name: Login to GitHub Container Registry
        if: steps.arch_check.outputs.supported == 'true' && github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set build flag for push
        if: steps.arch_check.outputs.supported == 'true' && github.event_name != 'pull_request'
        run: echo "BUILD_ARGS=" >> "$GITHUB_ENV"

      - name: Build ${{ matrix.addon }} add-on
        if: steps.arch_check.outputs.supported == 'true'
        uses: home-assistant/builder@master
        with:
          args: |
            ${{ env.BUILD_ARGS }} \
            --${{ matrix.arch }} \
            --target /data/${{ matrix.addon }} \
            --image "${{ matrix.addon }}-{arch}" \
            --docker-hub "ghcr.io/${{ github.repository_owner }}" \
            --addon
