---
configuration:
  PORT:
    name: Listening port
    description: >-
      TCP port the agent listens on. Used by the Docker API in Standard mode
      and by the health endpoint in Edge mode. Turn the Watchdog off if you
      change this away from 2376.
  LOG_LEVEL:
    name: Log level
    description: One of debug, info, warn or error.
  BIND_ADDRESS:
    name: Bind address
    description: >-
      Address the agent binds to. Use 127.0.0.1 to accept local connections
      only; the Watchdog has to be turned off in that case.
  TOKEN:
    name: Authentication token
    description: >-
      Shared secret used to authenticate Dockhand. Required in Edge mode, and
      required in Standard mode unless the agent binds to loopback only.
      Without it, anyone who can reach the port controls Docker on this host.
  AGENT_NAME:
    name: Agent name
    description: Human-readable name reported to Dockhand. Defaults to the hostname.
  DOCKHAND_SERVER_URL:
    name: Dockhand server URL
    description: >-
      WebSocket URL of the Dockhand server (ws:// or wss://). Setting this
      value switches the agent into Edge mode.
  TLS_CERT:
    name: TLS certificate
    description: Path to the server certificate, typically under /ssl.
  TLS_KEY:
    name: TLS key
    description: Path to the server private key, typically under /ssl.
  CA_CERT:
    name: CA certificate
    description: CA certificate used to verify the Dockhand server in Edge mode.
  TLS_SKIP_VERIFY:
    name: Skip TLS verification
    description: >-
      Disable TLS certificate verification. This allows man-in-the-middle
      attacks - use for testing only.
  ALLOW_INSECURE_NO_AUTH:
    name: Allow unauthenticated access
    description: >-
      Start Standard mode on a network-reachable address even though no token
      is set. This exposes the Docker API without any authentication. Only
      enable it on a network you fully trust.
  HEARTBEAT_INTERVAL:
    name: Heartbeat interval
    description: Keepalive interval in seconds.
  REQUEST_TIMEOUT:
    name: Request timeout
    description: Maximum duration of a single request, in seconds.
  RECONNECT_DELAY:
    name: Reconnect delay
    description: Initial reconnect delay in seconds (Edge mode).
  MAX_RECONNECT_DELAY:
    name: Maximum reconnect delay
    description: Upper bound for the exponential reconnect backoff, in seconds.
  WELCOME_TIMEOUT:
    name: Welcome timeout
    description: >-
      How long to wait for the Dockhand server's welcome message after
      connecting, in seconds (Edge mode).
  env_vars:
    name: Additional environment variables
    description: >-
      Extra environment variables forwarded to the Hawser process. Variables
      that control how the add-on itself runs (PATH, LD_PRELOAD,
      SUPERVISOR_TOKEN, ...) are rejected.
network:
  2376/tcp: Hawser listener (clear the host port when using Edge mode)
